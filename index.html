<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>작업 장부</title>
  <meta name="theme-color" content="#1B1917" />
  <!-- 스타일시트보다 먼저 테마를 정해둡니다. 나중에 정하면 밝은 테마로 쓰는
       사람이 새로고침할 때마다 어두운 화면이 한 번 번쩍여요. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("workLedger.theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#F4F4F2" : "#1B1917");
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20260918d" />
</head>
<body>
  <div id="app"></div>
  <!-- Source for the floating (picture-in-picture) timer. Parked off-screen
       rather than hidden: display:none can stop a canvas stream or block
       picture-in-picture from starting. -->
  <div style="position:fixed;left:-10000px;top:0;width:480px;height:270px;pointer-events:none" aria-hidden="true">
    <canvas id="wl-pip-canvas" width="480" height="270"></canvas>
    <video id="wl-pip-video" muted playsinline></video>
  </div>
  <script type="module" src="js/app.js?v=20260918d"></script>
</body>
</html>
